name: Deploy PWA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build web --release --dart-define=API_URL=https://stockgo-px32.onrender.com --dart-define=API_TIMEOUT=60
        working-directory: mobile
      - run: npx --yes netlify-cli deploy --prod --dir=mobile/build/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
